<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bubble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6f1;--ink:#2d2a32;--mut:#7d7784;--card:#fff;--line:#e9e1d8;--a:#8a7bd1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141c;--ink:#efeaf5;--mut:#a39cb0;--card:#221e2a;--line:#342e3e}}
:root[data-theme="dark"]{--bg:#17141c;--ink:#efeaf5;--mut:#a39cb0;--card:#221e2a;--line:#342e3e}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
main{max-width:460px;margin:0 auto;padding:16px 18px 48px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
h1{font:500 34px 'Cormorant Garamond',Georgia,serif;letter-spacing:.04em;margin:0}
nav{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
nav button,#ll{border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:6px 13px;border-radius:99px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--bg)}
#ll{font-size:18px;padding:4px 8px}
.mut{color:var(--mut);font-size:13px}
.bwrap{display:flex;justify-content:center;margin:10px 0 8px}
.bwrap svg{width:min(70vw,270px);animation:fl 6s ease-in-out infinite;filter:drop-shadow(0 14px 24px rgba(120,100,170,.18))}
@keyframes fl{50%{transform:translateY(-8px)}}
#water{transform:translateY(200px);transition:transform 1.6s cubic-bezier(.25,.8,.3,1)}
.wv{animation:wv 6s linear infinite;transition:fill 1.6s;fill:#6fbfd4}
#w2{animation-duration:9s;animation-direction:reverse;opacity:.45}
#w1{opacity:.82}
@keyframes wv{to{transform:translateX(-100px)}}
textarea{width:100%;min-height:110px;resize:none;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);font:inherit;padding:14px;outline:none}
textarea:focus{border-color:var(--a)}
.pri{background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:13px 26px;font:inherit;cursor:pointer;margin-top:12px}
.ghost{background:none;border:0;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;margin-top:10px}
#go{display:block;margin:12px auto 0}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--a);border-radius:22px;padding:18px 20px;margin-top:20px;animation:pp .5s ease}
.card h3{font:500 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:16px 0 4px}
.card h3:first-child{margin-top:0}
.big{font:500 28px 'Cormorant Garamond',Georgia,serif;margin:0;color:var(--a)}
.card p{margin:4px 0}.card ul{margin:4px 0;padding-left:18px}.card li{margin:4px 0}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--a);border-radius:9px;transition:width 1.4s cubic-bezier(.25,.8,.3,1)}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;border-radius:99px;padding:7px 14px;margin:4px 6px 0 0;cursor:pointer}
.chip:hover{border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0}
.orb{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.75),var(--card) 62%);font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);box-shadow:0 8px 20px rgba(120,100,160,.13);animation:fl 5s ease-in-out infinite;transition:scale .2s}
.orb:hover{scale:1.08}
.orb span{font-size:11px;color:var(--mut);max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orb:nth-child(2n){animation-delay:-2s}.orb:nth-child(3n){animation-delay:-3.5s}
.mm{display:block;margin:6px auto 0;border:0;border-radius:99px;padding:14px 26px;font:inherit;color:#fff;cursor:pointer;background:linear-gradient(135deg,#f2b84b,#e2674f 60%,#a584d6);box-shadow:0 0 0 0 rgba(242,184,75,.5);animation:gl 2.4s infinite}
@keyframes gl{70%{box-shadow:0 0 0 16px rgba(242,184,75,0)}}
.ov{position:fixed;inset:0;background:rgba(20,16,30,.45);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mod{background:var(--card);border-radius:28px;padding:24px;max-width:400px;width:100%;max-height:88vh;overflow:auto;text-align:center;animation:pp .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pp{from{transform:scale(.7);opacity:0}}
.mod h2{font:500 26px 'Cormorant Garamond',Georgia,serif;margin:4px 0 8px}
.be{font-size:88px;line-height:1.1;animation:pp .5s}
.tok{background:var(--bg);border:1px dashed var(--line);border-radius:18px;padding:14px;margin:10px 0;font-style:italic}
.q{margin:14px 0;text-align:left}.q p{margin:0 0 6px;font-size:14px}
.rts{display:flex;gap:6px}
.rt,.em{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 0;font:inherit;cursor:pointer}
.rt.on,.em.on{background:var(--ink);color:var(--bg)}
.em{font-size:20px;flex:none;width:44px;margin:3px}
.mod input{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;padding:11px;margin-top:8px}
</style>
</head>
<body>
<main>
<header><h1>bubble</h1><nav><button data-t="today" class="on">today</button><button data-t="space">my space</button></nav><button id="ll" title="love language">♡</button></header>
<section id="today">
<div class="bwrap"><svg id="bub" viewBox="0 0 200 200"><defs><clipPath id="c"><circle cx="100" cy="100" r="90"/></clipPath><radialGradient id="g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
<circle cx="100" cy="100" r="90" fill="var(--card)" fill-opacity=".6"/>
<g clip-path="url(#c)"><g id="water"><path id="w2" class="wv" d="M0 0Q25 -8 50 0T100 0T150 0T200 0T250 0T300 0T350 0T400 0V220H0Z"/><path id="w1" class="wv" d="M0 0Q25 8 50 0T100 0T150 0T200 0T250 0T300 0T350 0T400 0V220H0Z"/></g></g>
<circle cx="100" cy="100" r="90" fill="url(#g)" stroke="var(--line)" stroke-width="2"/>
<path d="M45 72Q55 46 86 36" stroke="#fff" stroke-opacity=".75" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div>
<textarea id="txt" placeholder="how are you feeling today? let it all out…"></textarea>
<button class="pri" id="go">let it out</button>
<div id="res"></div>
</section>
<section id="space" hidden>
<p class="mut" style="text-align:center">little things that bring you back to yourself</p>
<div class="grid" id="grid"></div>
<div style="text-align:center"><button class="pri" id="add">+ add to my bubble</button></div>
<div style="margin-top:28px"><button class="mm">make me feel better ✨</button></div>
</section>
</main>
<div class="ov" id="ov" hidden><div class="mod" id="mod"></div></div>
<script>
const $=s=>document.querySelector(s),O=$('#ov'),M=$('#mod');
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem('bubble.'+k));return v==null?d:v}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem('bubble.'+k,JSON.stringify(v))}catch(e){}
};
